<section id="contact">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Contact Us</h2>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <form
                        name="sentMessage"
                        id="contactForm"
                        data-endpoint="{{ site.contact_api_url }}"
                    >
                        <div class="row">
                            <div class="col-md-6">
                                <div class="control-group form-group">
                                    <input type="text" class="form-control" placeholder="Your Name" id="name" name="name" autocomplete="name" maxlength="100" required>
                                </div>
                                <div class="control-group form-group">
                                    <input type="email" class="form-control" placeholder="Your Email" id="email" name="email" autocomplete="email" maxlength="254" required>
                                </div>
                                <div class="control-group form-group">
                                    <input type="tel" class="form-control" placeholder="Your Phone" id="phone" name="phone" autocomplete="tel" maxlength="50">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="control-group form-group">
                                    <textarea class="form-control" placeholder="Your Message" id="message" name="message" maxlength="5000" required></textarea>
                                </div>
                            </div>
                            <div class="clearfix"></div>
                            <div class="col-lg-12 text-center">
                                <div id="contactStatus" role="status" aria-live="polite"></div>
                                <button type="submit" class="btn btn-xl" id="contactSubmit">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
