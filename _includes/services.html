<!-- Services Section (nav: SERVICES) -->
    <section id="team" class="services-section bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Services</h2>
                    <div class="services-tabs" role="tablist" aria-label="Services">
                        <button type="button" class="service-tab active" data-service="product" aria-selected="true">
                            Product Service
                        </button>
                        <button type="button" class="service-tab" data-service="development" aria-selected="false">
                            Development Service
                        </button>
                        <button type="button" class="service-tab" data-service="solution" aria-selected="false">
                            Solution Service
                        </button>
                    </div>
                </div>
            </div>
            <div class="row services-carousel-wrap">
                <div class="col-lg-12">
                    <div class="services-carousel"
                        data-product-images="{{ site.baseurl }}/img/products/Edge.robo.png"
                        data-development-images="{{ site.baseurl }}/img/products/amp.robo.png"
                        data-solution-images="{{ site.baseurl }}/img/services/Hull cleaning.png|{{ site.baseurl }}/img/services/Dam inspection.png|{{ site.baseurl }}/img/services/Pipeline inspection.png">
                        <button type="button" class="service-carousel-btn service-carousel-prev" aria-label="Previous service image">
                            <span aria-hidden="true">&lt;</span>
                        </button>
                        <div class="service-carousel-frame">
                            <img class="service-carousel-image" src="{{ site.baseurl }}/img/products/Edge.robo.png" alt="Product service">
                        </div>
                        <button type="button" class="service-carousel-btn service-carousel-next" aria-label="Next service image">
                            <span aria-hidden="true">&gt;</span>
                        </button>
                    </div>
                    <div class="service-carousel-description" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </section>
